name: PR Preview Screenshots

# Only runs when a PR actually touches the frontend (or this workflow file itself) - a
# backend-only or docs-only PR has nothing for a screenshot to usefully show.
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pr-preview.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: welltrack
          POSTGRES_PASSWORD: welltrack
          POSTGRES_DB: welltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://welltrack:welltrack@localhost:5432/welltrack?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Check out the PR's head commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate ephemeral JWT secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # The backend only runs once and stays up for both captures below - the path filter
      # above means a screenshot-triggering PR only touches frontend/ in the common case, so
      # the head commit's backend is a reasonable stand-in for "before" too. A PR that
      # happens to change both frontend and backend will compare two frontend builds against
      # that same (head) backend rather than the base commit's backend - a known, accepted
      # simplification (see the implementation log).
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: node dist/index.js &

      - name: Wait for backend to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:4000/api/health; do sleep 1; done'

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # --- AFTER: the PR's own frontend code ---

      - name: "AFTER: install frontend dependencies"
        working-directory: frontend
        run: npm ci

      - name: "AFTER: build frontend"
        working-directory: frontend
        run: npm run build

      - name: "AFTER: start frontend preview server"
        working-directory: frontend
        run: npm run preview -- --port 5173 &

      - name: "AFTER: wait for frontend to be ready"
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173/; do sleep 1; done'

      - name: "AFTER: capture screenshots"
        working-directory: frontend
        run: node scripts/capture-pr-screenshots.mjs
        env:
          SCREENSHOT_DIR: pr-screenshots-output/after

      - name: Stop the AFTER preview server
        run: lsof -ti:5173 | xargs -r kill

      # --- BEFORE: the PR's base commit, built in a separate worktree so the current
      # checkout (and the capture script we keep reusing from it) is left untouched ---

      - name: "BEFORE: check out the PR's base commit into a worktree"
        id: before_checkout
        continue-on-error: true
        # fetch-depth: 0 above already fetched full history for every branch, so the base
        # commit is guaranteed to be present locally already - no extra fetch needed.
        run: git worktree add /tmp/before-checkout "${{ github.event.pull_request.base.sha }}"

      - name: "BEFORE: install frontend dependencies"
        if: steps.before_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/before-checkout/frontend
        run: npm ci

      - name: "BEFORE: build frontend"
        if: steps.before_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/before-checkout/frontend
        run: npm run build

      - name: "BEFORE: start frontend preview server"
        if: steps.before_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/before-checkout/frontend
        run: npm run preview -- --port 5173 &

      - name: "BEFORE: wait for frontend to be ready"
        if: steps.before_checkout.outcome == 'success'
        continue-on-error: true
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173/; do sleep 1; done'

      # Runs the capture script from the HEAD checkout (this job's main working directory)
      # even while pointed at the BEFORE server - so this still works even for the very PR
      # that first introduces this script, when the base commit doesn't have it yet.
      - name: "BEFORE: capture screenshots"
        if: steps.before_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        run: node scripts/capture-pr-screenshots.mjs
        env:
          SCREENSHOT_DIR: pr-screenshots-output/before

      - name: Publish screenshots to the pr-screenshots branch
        id: publish
        if: always()
        run: |
          set -e
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SRC_DIR="$(pwd)/frontend/pr-screenshots-output"
          WORKTREE_DIR="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin pr-screenshots:pr-screenshots; then
            git worktree add "$WORKTREE_DIR" pr-screenshots
          else
            git worktree add --detach "$WORKTREE_DIR"
            (cd "$WORKTREE_DIR" && git checkout --orphan pr-screenshots && git rm -rf . > /dev/null)
          fi

          # This orphan branch holds only screenshot PNGs, never real app code - but Vercel's
          # GitHub integration still tries to deploy every branch pushed to this repo. Its
          # configured Root Directory ("frontend") doesn't exist here, which makes every push
          # show up as a failed "Build Failed" deployment before any ignoreCommand could even
          # run (Vercel's own docs confirm that command executes *inside* the Root Directory -
          # useless if that directory doesn't exist yet). A minimal frontend/vercel.json fixes
          # the chicken-and-egg problem: the folder now exists, so Root Directory resolves, and
          # its unconditional ignoreCommand immediately skips the build - a clean "Canceled"
          # deployment instead of a red error.
          mkdir -p "$WORKTREE_DIR/frontend"
          echo '{"ignoreCommand": "exit 0"}' > "$WORKTREE_DIR/frontend/vercel.json"

          EXPECTED_COUNT=3
          BEFORE_COUNT=0
          if [ -d "$SRC_DIR/before" ]; then
            BEFORE_COUNT=$(ls "$SRC_DIR/before"/*.png 2>/dev/null | wc -l)
          fi
          if [ "$BEFORE_COUNT" -eq "$EXPECTED_COUNT" ]; then
            HAS_BEFORE=true
          else
            HAS_BEFORE=false
          fi

          mkdir -p "$WORKTREE_DIR/pr-$PR_NUMBER"
          rm -rf "${WORKTREE_DIR:?}/pr-$PR_NUMBER"/*
          mkdir -p "$WORKTREE_DIR/pr-$PR_NUMBER/after"
          cp "$SRC_DIR"/after/*.png "$WORKTREE_DIR/pr-$PR_NUMBER/after/"
          if [ "$HAS_BEFORE" = "true" ]; then
            mkdir -p "$WORKTREE_DIR/pr-$PR_NUMBER/before"
            cp "$SRC_DIR"/before/*.png "$WORKTREE_DIR/pr-$PR_NUMBER/before/"
          fi

          cd "$WORKTREE_DIR"
          git add "pr-$PR_NUMBER" frontend/vercel.json
          if git diff --cached --quiet; then
            echo "No screenshot changes to publish."
          else
            git commit -m "Update PR #$PR_NUMBER preview screenshots"
            git push origin pr-screenshots
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "has_before=$HAS_BEFORE" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR with the screenshots
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = "${{ steps.publish.outputs.sha }}";
            const hasBefore = "${{ steps.publish.outputs.has_before }}" === "true";
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const marker = "<!-- pr-preview-screenshots -->";
            const shots = [
              ["01-register-then-dashboard", "Register -> Dashboard (auto-logged-in)"],
              ["02-after-logout-redirected-to-login", "Logout -> redirected to Login"],
              ["03-login-then-dashboard", "Login -> Dashboard"],
            ];
            const rawUrl = (variant, file) =>
              `https://raw.githubusercontent.com/${repo}/${sha}/pr-${prNumber}/${variant}/${file}.png`;

            const body = [
              marker,
              "### Preview screenshots",
              hasBefore
                ? "Captured automatically by driving a real headless browser against this PR's build, compared against the base branch."
                : "Captured automatically by driving a real headless browser against this PR's build. (No \"before\" comparison - the base commit's frontend build didn't produce a comparable set of screenshots.)",
              "",
              ...shots.map(([file, caption]) =>
                hasBefore
                  ? `**${caption}**\n\n| Before | After |\n| --- | --- |\n| ![before ${caption}](${rawUrl("before", file)}) | ![after ${caption}](${rawUrl("after", file)}) |`
                  : `**${caption}**\n\n![${caption}](${rawUrl("after", file)})`,
              ),
            ].join("\n\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
