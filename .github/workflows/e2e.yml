name: E2E Tests

# Runs against a real backend + real Postgres + a real built frontend, driven by a real
# browser (see frontend/playwright.config.ts) - not the mocked-fetch component tests under
# frontend/src/, which already run as part of the frontend's own CI job.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: welltrack
          POSTGRES_PASSWORD: welltrack
          POSTGRES_DB: welltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://welltrack:welltrack@localhost:5432/welltrack?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate ephemeral JWT secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # Seeds the system-default symptoms (Headache, Fatigue, etc.) - trends-after-seeding.spec.ts
      # reads the first one back via GET /api/symptoms rather than creating its own, and that list
      # is empty on a completely fresh CI database without this.
      - name: Seed the database
        working-directory: backend
        run: npx prisma db seed

      - name: Build backend
        working-directory: backend
        run: npm run build

      # NODE_ENV=test (not "production") deliberately: this suite's own account-deletion and
      # quick-add-and-dashboard specs each register 1-2 fresh accounts, and every registration is
      # itself two auth-rate-limited requests (register + the automatic follow-up login - see
      # AuthContext.tsx). A full clean run of this suite uses exactly the rate limiter's entire
      # 10-per-15-minutes budget (see rateLimiter.ts's own skipInTests()), which leaves zero room
      # for CI to retry a flaky run without waiting out the window. NODE_ENV=test is the same
      # escape hatch the backend's own Vitest suite relies on, applied here for the same reason:
      # this is controlled, known-good automated traffic, not the real anonymous abuse the
      # limiter exists to blunt.
      - name: Start backend
        working-directory: backend
        run: NODE_ENV=test node dist/index.js &

      - name: Wait for backend to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:4000/api/health; do sleep 1; done'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend preview server
        working-directory: frontend
        run: npm run preview -- --port 5173 &

      - name: Wait for frontend to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173/; do sleep 1; done'

      - name: Run E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
